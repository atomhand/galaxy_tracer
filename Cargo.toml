[package]
name = "galaxy_tracer"
version = "0.1.0"
edition = "2021"

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

[dependencies]
bevy = "0.16.1"
bevy_egui = "0.36.0"
bytemuck = "1.23.2"
rand = "0.9.2"
rand_chacha = "0.9.0"
rand_distr = "0.5.1"
rayon = "1.11.0"
volume_upscaler = { path = "crates/volume_upscaler" }

[workspace]
resolver = "2"
members = ["crates/*"]
